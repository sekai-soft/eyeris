[project]
name = "eyeris"
version = "0.1.0"
description = "Simple media recommendation engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pillow>=10.0.0",
    "httpx>=0.25.0",
    "certifi>=2023.0.0",
]

[tool.uv.sources]
# Only torch needs the CPU index - torchvision will automatically be CPU-only
# when paired with CPU-only torch, and PyPI has better platform support
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
